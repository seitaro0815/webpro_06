<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>タスク登録</title>
</head>
<body>

    <h1>タスクの登録</h1>

    <form action="/tasks" method="POST">

        <label for="task">タスク名:</label><br>
        <input type="text" name="task" required><br>

        <label for="kigen">期限:</label><br>
        <input type="text" name="kigen" required><br>

        <label for="detail">詳細:</label><br>
        <input type="text" name="detail"><br><br>

        <input type="submit" value="登録">
    </form>

    <br>
    <a href="/tasks">タスク一覧に戻る</a>

</body>
</html>
