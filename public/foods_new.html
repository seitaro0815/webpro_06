<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>食材登録</title>
</head>
<body>
    <h1>食材の登録</h1>
    <form action="/foods" method="POST">
        
        <label for="name">食べ物:</label><br>
        <input type="text" name="name" required><br>

        <label for="limit">賞味期限:</label><br>
        <input type="text" name="limit" required><br>

        <label for="qty">個数:</label><br>
        <input type="text" name="qty"><br>

        <label for="memo">備考:</label><br>
        <input type="text" name="memo"><br><br>

        <input type="submit" value="登録">
    </form>
    <br>
    <a href="/foods">一覧に戻る</a>
</body>
</html>
